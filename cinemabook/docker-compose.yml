version: '3.9'

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cinemabook_postgres
    environment:
      POSTGRES_DB:       cinemabook_db
      POSTGRES_USER:     "${DB_USERNAME:-cinemabook}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cinemabook_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:

# ── How to use ─────────────────────────────────────────────
# Start:  docker compose --env-file backend/.env up -d
# Stop:   docker compose --env-file backend/.env down
# Reset (deletes local database and Redis data): docker compose --env-file backend/.env down -v
