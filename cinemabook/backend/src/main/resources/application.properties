# Application
spring.application.name=cinemabook
spring.config.import=optional:file:./cinemabook/backend/.env[.properties],optional:file:./.env[.properties]

# Server
server.port=8082
server.servlet.context-path=/api/v1

# Database (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cinemabook_db}
spring.datasource.username=${DB_USERNAME:cinemabook}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis (used by SessionService for device-session enforcement only)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# JWT
cinemabook.jwt.secret=${JWT_SECRET}
cinemabook.jwt.access-token-expiry-ms=900000
cinemabook.jwt.refresh-token-expiry-ms=604800000

# CORS
cinemabook.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# File upload limits (for Phase 2 film uploads)
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB

# Logging
logging.level.com.cinemabook=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO

# Actuator (health endpoint used by IntelliJ and Docker checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Storage (Phase 2)
# Default: local filesystem. Set spring.profiles.active=prod for S3.
cinemabook.storage.local-path=${user.home}/cinemabook-storage
cinemabook.storage.local-base-url=http://localhost:8082/api/v1/files

# Stripe (Phase 2)
# mock=true means no real Stripe calls ? safe for dev
cinemabook.stripe.secret-key=${STRIPE_SECRET_KEY:}
cinemabook.stripe.mock=${STRIPE_MOCK:true}
cinemabook.stripe.connect-return-url=${STRIPE_RETURN_URL:http://localhost:3000/owner/bank/return}
