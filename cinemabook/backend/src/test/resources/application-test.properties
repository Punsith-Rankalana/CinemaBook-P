# Test profile ? uses the same Postgres/Redis from docker-compose
# Override as needed for CI pipelines

spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/cinemabook_db_test}
spring.datasource.username=${TEST_DB_USERNAME:${DB_USERNAME:cinemabook}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD}}

spring.data.redis.host=localhost
spring.data.redis.port=6379

cinemabook.cors.allowed-origins=http://localhost:3000

logging.level.com.cinemabook=WARN
logging.level.org.springframework.security=WARN
